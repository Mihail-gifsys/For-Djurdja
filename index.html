
<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Za Đurđu 🩷</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffe0ec, #ffc1d9, #fff0f5);
}

.card {
    background: white;
    padding: 40px 25px;
    width: 90%;
    max-width: 400px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 10px 35px rgba(180, 70, 120, 0.2);
}

.heart {
    font-size: 55px;
    margin-bottom: 15px;
}

h1 {
    color: #d64f86;
    font-size: 27px;
}

p {
    color: #87546b;
    font-size: 18px;
    line-height: 1.6;
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 30px;
}

button {
    border: none;
    border-radius: 30px;
    padding: 14px 28px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

#yes {
    background: #ed78a5;
    color: white;
}

#no {
    background: #eeeeee;
    color: #555;
    position: fixed;
    left: 55%;
    top: 65%;
    z-index: 10;
}

#message {
    color: #d64f86;
    font-size: 19px;
    font-weight: bold;
    margin-top: 25px;
}
</style>
</head>

<body>

<div class="card">
    <div class="heart">🩷</div>

    <h1>Đurđa, hoćeš da odemo na kafu?</h1>

    <p>
        Kada dođem kući, na svu žalost
        dolazim tek u januaru 🥲🩷
    </p>

    <div class="buttons">
        <button id="yes">DA 🩷</button>
    </div>

    <div id="message"></div>
</div>

<button id="no">NE</button>

<script>
const no = document.getElementById("no");
const yes = document.getElementById("yes");
const message = document.getElementById("message");

function runAway() {
    const maxX = window.innerWidth - no.offsetWidth - 10;
    const maxY = window.innerHeight - no.offsetHeight - 10;

    const x = Math.random() * Math.max(0, maxX - 10) + 10;
    const y = Math.random() * Math.max(0, maxY - 10) + 10;

    no.style.left = x + "px";
    no.style.top = y + "px";
}

no.addEventListener("pointerenter", runAway);

no.addEventListener("touchstart", function(e) {
    e.preventDefault();
    runAway();
}, { passive: false });

no.addEventListener("click", runAway);

yes.addEventListener("click", function() {
    message.innerHTML = "Jeeeej! Vidimo se u januaru! 🩷☕";
    no.style.display = "none";
});

window.addEventListener("resize", runAway);
</script>

</body>
</html>
